<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #eef3e6;
    --paper-bar: #dfe9d6;
    --ink: #1c3626;
    --ink-soft: #4b5d50;
    --rule: #93ad8f;
    --rule-strong: #587158;
    --stamp: #a13d2e;
    --stamp-soft: #a13d2e22;
    --brass: #a9823f;
    --card-shadow: 0 18px 40px rgba(20,40,25,0.18);
    --binder: #d9cfa8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100vh;
    background: #cdd9c3;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.35), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(0,0,0,0.08), transparent 45%);
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink);
  }
  .page{
    max-width: 720px;
    margin: 32px auto 80px;
    padding: 0 16px;
  }
  .masthead{
    display:flex; align-items:baseline; justify-content:space-between;
    padding: 0 6px 14px;
    border-bottom: 3px double var(--rule-strong);
    margin-bottom: 18px;
  }
  .masthead h1{
    font-family:'Special Elite', monospace;
    font-size: 28px;
    letter-spacing: 1px;
    margin:0;
    color: var(--ink);
  }
  .masthead .sub{
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .book{
    position:relative;
    background:
      repeating-linear-gradient(
        to bottom,
        var(--paper) 0px, var(--paper) 27px,
        var(--paper-bar) 27px, var(--paper-bar) 54px
      );
    border-radius: 4px;
    box-shadow: var(--card-shadow);
    padding: 28px 26px 26px 46px;
    border: 1px solid #c9d6bf;
  }
  .book::before{
    content:"";
    position:absolute;
    left: 18px; top: 0; bottom: 0;
    width: 2px;
    background: repeating-linear-gradient(
      to bottom, var(--binder) 0 10px, transparent 10px 24px
    );
    opacity:0.9;
  }
  .book::after{
    content:"";
    position:absolute;
    left: 0; top: 0; bottom: 0; width: 30px;
    background-image: radial-gradient(circle at 8px 0, transparent 5px, var(--paper) 5.5px);
    background-size: 100% 40px;
    background-repeat: repeat-y;
  }

  .tabs{ display:flex; gap:6px; margin-bottom:18px; }
  .tab{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:1px; text-transform:uppercase;
    background:none; border:1px solid var(--rule-strong);
    color: var(--ink-soft);
    padding:8px 14px; cursor:pointer; border-radius:3px 3px 0 0;
    border-bottom:none;
  }
  .tab.active{
    background: var(--paper);
    color: var(--stamp);
    font-weight:600;
    box-shadow: 0 -2px 0 var(--stamp) inset;
  }
  .panel{ display:none; }
  .panel.active{ display:block; }

  label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:1.5px;
    color: var(--ink-soft); margin-bottom:4px; margin-top:14px;
  }
  input, select{
    width:100%; font-family:'IBM Plex Mono', monospace; font-size:15px;
    background:transparent; border:none; border-bottom: 1.5px solid var(--rule-strong);
    padding:6px 2px; color:var(--ink); outline:none;
  }
  input:focus, select:focus{ border-bottom-color: var(--stamp); }
  .row2{ display:flex; gap:16px; }
  .row2 > div{ flex:1; }

  .stamp-btn{
    margin-top:22px; width:100%;
    font-family:'Special Elite', monospace;
    font-size:16px; letter-spacing:2px; text-transform:uppercase;
    background: transparent;
    border: 2.5px solid var(--stamp);
    color: var(--stamp);
    padding: 10px;
    border-radius: 6px;
    cursor:pointer;
    transform: rotate(-1deg);
    transition: transform .15s ease, background .15s ease, color .15s ease;
  }
  .stamp-btn:hover{ background: var(--stamp); color:#fff; transform: rotate(0deg); }
  .stamp-btn:active{ transform: scale(0.97) rotate(0deg); }

  .status-line{ font-size:12px; color:var(--ink-soft); margin-top:10px; min-height:16px; }
  .status-line.err{ color:var(--stamp); }

  .field-note{
    font-size:11px; color:var(--ink-soft); margin-top:18px; line-height:1.5;
    border-top:1px dashed var(--rule); padding-top:10px;
  }
  .field-note code{ background:#00000010; padding:1px 5px; border-radius:3px; }

  .month-select{ margin-bottom: 12px; }
  .total-line{
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom: 3px double var(--rule-strong);
    padding-bottom: 10px; margin-bottom: 16px;
  }
  .total-line .label{ font-family:'Special Elite',monospace; font-size:15px; letter-spacing:1px;}
  .total-line .amount{ font-size:22px; font-weight:700; }

  .cat-row{ margin-bottom: 14px; }
  .cat-row .cat-head{
    display:flex; justify-content:space-between; font-size:13px;
    text-transform:uppercase; letter-spacing:1px; margin-bottom:4px;
  }
  .cat-row .cat-amt{ font-weight:600; }
  .cat-bar-track{ height:7px; background: rgba(0,0,0,0.08); border-radius: 2px; overflow:hidden;}
  .cat-bar-fill{ height:100%; background: linear-gradient(90deg, var(--rule-strong), var(--stamp)); border-radius:2px; }

  .entries{ margin-top: 24px; }
  .entries h3{
    font-family:'Special Elite', monospace; font-size:13px; letter-spacing:1px;
    color: var(--ink-soft); text-transform:uppercase; margin-bottom:8px;
    border-bottom:1px dashed var(--rule); padding-bottom:6px;
  }
  .entry-row{
    display:flex; justify-content:space-between; font-size:13px; padding:4px 0;
    border-bottom: 1px dotted rgba(0,0,0,0.12);
  }
  .entry-row .e-date{ color: var(--ink-soft); width:90px; flex-shrink:0; }
  .entry-row .e-cat{ flex:1; text-transform:uppercase; letter-spacing:0.5px; }
  .entry-row .e-amt{ font-weight:600; width:90px; text-align:right; }

  .empty{ font-size:13px; color:var(--ink-soft); font-style:italic; padding:12px 0; }

  @media (max-width:480px){
    .masthead h1{ font-size:22px; }
    .book{ padding:22px 16px 20px 36px; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="masthead">
    <h1>Ledger</h1>
    <div class="sub">Personal Expenditure Book</div>
  </div>

  <div class="book">
    <div class="tabs">
      <button class="tab active" data-tab="entry">New Entry</button>
      <button class="tab" data-tab="report">Monthly Report</button>
    </div>

    <!-- ENTRY PANEL -->
    <div class="panel active" id="panel-entry">
      <form id="entry-form">
        <label for="f-category">Category</label>
        <select id="f-category">
          <option>Food</option>
          <option>Transport</option>
          <option>Groceries</option>
          <option>Utilities</option>
          <option>Rent</option>
          <option>Entertainment</option>
          <option>Health</option>
          <option>Shopping</option>
          <option>Other</option>
          <option value="__custom">+ Custom category…</option>
        </select>
        <input type="text" id="f-category-custom" placeholder="Enter category" style="display:none; margin-top:8px;">

        <div class="row2">
          <div>
            <label for="f-amount">Amount</label>
            <input type="number" id="f-amount" step="0.01" min="0" placeholder="0.00" required>
          </div>
          <div>
            <label for="f-date">Date</label>
            <input type="date" id="f-date" required>
          </div>
        </div>

        <button type="submit" class="stamp-btn">Ring Up</button>
        <div class="status-line" id="status"></div>
      </form>

      <div class="entries">
        <h3>Recent Entries</h3>
        <div id="recent-list"><div class="empty">Loading…</div></div>
      </div>

      <div class="field-note" id="config-note"></div>
    </div>

    <!-- REPORT PANEL -->
    <div class="panel" id="panel-report">
      <select id="month-select" class="month-select"></select>
      <div class="total-line">
        <span class="label">Total Spent</span>
        <span class="amount" id="month-total">$0.00</span>
      </div>
      <div id="category-breakdown"><div class="empty">Loading…</div></div>
    </div>

  </div>
</div>

<script>
/* ------------------------------------------------------------------
 * CONFIGURE ME: paste your Google Apps Script Web App URL here.
 * See README.md for how to get this. Until you do, the app runs in
 * local demo mode (data is stored in your browser only).
 * ---------------------------------------------------------------- */
const API_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

const isDemoMode = !API_URL || API_URL.indexOf("PASTE_YOUR") !== -1;
const LOCAL_KEY = "ledger_demo_entries";

function todayISO(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function loadLocalEntries(){
  try{ return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); }catch(e){ return []; }
}
function saveLocalEntries(list){
  localStorage.setItem(LOCAL_KEY, JSON.stringify(list));
}

async function fetchEntries(){
  if(isDemoMode) return loadLocalEntries();
  const res = await fetch(API_URL, { method: "GET" });
  if(!res.ok) throw new Error("Failed to load entries");
  return await res.json();
}

async function addEntry(entry){
  if(isDemoMode){
    const list = loadLocalEntries();
    list.push(entry);
    saveLocalEntries(list);
    return { status: "ok" };
  }
  // sent as text/plain to avoid a CORS preflight against Apps Script
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(entry)
  });
  return await res.json();
}

function money(n){
  return "$" + Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}

/* ---------------- Tabs ---------------- */
document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
    if(btn.dataset.tab === "report") renderReport();
  });
});

/* ---------------- Entry form ---------------- */
const dateInput = document.getElementById("f-date");
dateInput.value = todayISO();

const catSelect = document.getElementById("f-category");
const catCustom = document.getElementById("f-category-custom");
catSelect.addEventListener("change", ()=>{
  catCustom.style.display = catSelect.value === "__custom" ? "block" : "none";
});

document.getElementById("entry-form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const statusEl = document.getElementById("status");
  const amount = parseFloat(document.getElementById("f-amount").value);
  const category = catSelect.value === "__custom" ? (catCustom.value.trim() || "Other") : catSelect.value;
  const date = dateInput.value || todayISO();

  if(!amount || amount <= 0){
    statusEl.textContent = "Enter an amount greater than zero.";
    statusEl.classList.add("err");
    return;
  }

  statusEl.classList.remove("err");
  statusEl.textContent = "Posting to ledger…";

  try{
    const result = await addEntry({ date, amount, category });
    if(result.status !== "ok") throw new Error(result.message || "Unknown error");
    statusEl.textContent = "Entered " + money(amount) + " under " + category + ".";
    document.getElementById("f-amount").value = "";
    await renderRecent();
  }catch(err){
    statusEl.textContent = "Could not save: " + err.message;
    statusEl.classList.add("err");
  }
});

/* ---------------- Recent entries ---------------- */
async function renderRecent(){
  const listEl = document.getElementById("recent-list");
  try{
    const entries = await fetchEntries();
    if(entries.length === 0){
      listEl.innerHTML = '<div class="empty">No entries yet. Ring up your first one above.</div>';
      return;
    }
    const sorted = [...entries].sort((a,b)=> b.date.localeCompare(a.date)).slice(0,8);
    listEl.innerHTML = sorted.map(en => `
      <div class="entry-row">
        <span class="e-date">${en.date}</span>
        <span class="e-cat">${en.category}</span>
        <span class="e-amt">${money(en.amount)}</span>
      </div>
    `).join("");
  }catch(err){
    listEl.innerHTML = '<div class="empty">Could not load entries: ' + err.message + '</div>';
  }
}

/* ---------------- Monthly report ---------------- */
function monthKey(dateStr){ return dateStr.slice(0,7); } // yyyy-MM
function monthLabel(key){
  const [y,m] = key.split("-");
  const d = new Date(Number(y), Number(m)-1, 1);
  return d.toLocaleString(undefined, { month: "long", year: "numeric" });
}

async function renderReport(){
  const monthSelect = document.getElementById("month-select");
  const totalEl = document.getElementById("month-total");
  const breakdownEl = document.getElementById("category-breakdown");

  let entries;
  try{
    entries = await fetchEntries();
  }catch(err){
    breakdownEl.innerHTML = '<div class="empty">Could not load entries: ' + err.message + '</div>';
    return;
  }

  if(entries.length === 0){
    monthSelect.innerHTML = "";
    totalEl.textContent = money(0);
    breakdownEl.innerHTML = '<div class="empty">No entries yet.</div>';
    return;
  }

  const months = [...new Set(entries.map(e=>monthKey(e.date)))].sort().reverse();
  const currentMonth = monthKey(todayISO());
  const selected = monthSelect.value && months.includes(monthSelect.value) ? monthSelect.value
                   : (months.includes(currentMonth) ? currentMonth : months[0]);

  monthSelect.innerHTML = months.map(m => `<option value="${m}" ${m===selected?"selected":""}>${monthLabel(m)}</option>`).join("");
  monthSelect.onchange = renderReport;

  const inMonth = entries.filter(e => monthKey(e.date) === selected);
  const total = inMonth.reduce((s,e)=> s + Number(e.amount), 0);
  totalEl.textContent = money(total);

  const byCat = {};
  inMonth.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + Number(e.amount); });
  const catList = Object.entries(byCat).sort((a,b)=> b[1]-a[1]);
  const max = catList.length ? catList[0][1] : 1;

  breakdownEl.innerHTML = catList.map(([cat, amt]) => `
    <div class="cat-row">
      <div class="cat-head">
        <span>${cat}</span>
        <span class="cat-amt">${money(amt)} · ${total ? Math.round(amt/total*100) : 0}%</span>
      </div>
      <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${(amt/max*100).toFixed(1)}%"></div></div>
    </div>
  `).join("");
}

/* ---------------- Config note ---------------- */
document.getElementById("config-note").innerHTML = isDemoMode
  ? 'Running in <strong>local demo mode</strong> — entries are saved only in this browser (<code>localStorage</code>). Deploy the included <code>Code.gs</code> as a Google Apps Script Web App and paste the URL into <code>API_URL</code> at the top of the script in <code>index.html</code> to use a real Google Sheet as your database.'
  : 'Connected to your Google Sheet via Apps Script.';

renderRecent();
</script>
</body>
</html>
