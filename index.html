<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #eef3e6;
    --paper-bar: #dfe9d6;
    --ink: #1c3626;
    --ink-soft: #4b5d50;
    --rule: #93ad8f;
    --rule-strong: #587158;
    --stamp: #a13d2e;
    --stamp-soft: #a13d2e22;
    --brass: #a9823f;
    --card-shadow: 0 18px 40px rgba(20,40,25,0.18);
    --binder: #d9cfa8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100vh;
    background: #cdd9c3;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.35), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(0,0,0,0.08), transparent 45%);
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink);
  }
  .page{
    max-width: 720px;
    margin: 32px auto 80px;
    padding: 0 16px;
  }
  .masthead{
    display:flex; align-items:baseline; justify-content:space-between;
    padding: 0 6px 14px;
    border-bottom: 3px double var(--rule-strong);
    margin-bottom: 18px;
  }
  .masthead h1{
    font-family:'Special Elite', monospace;
    font-size: 28px;
    letter-spacing: 1px;
    margin:0;
    color: var(--ink);
  }
  .masthead .sub{
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .book{
    position:relative;
    background:
      repeating-linear-gradient(
        to bottom,
        var(--paper) 0px, var(--paper) 27px,
        var(--paper-bar) 27px, var(--paper-bar) 54px
      );
    border-radius: 4px;
    box-shadow: var(--card-shadow);
    padding: 28px 26px 26px 46px;
    border: 1px solid #c9d6bf;
  }
  .book::before{
    content:"";
    position:absolute;
    left: 18px; top: 0; bottom: 0;
    width: 2px;
    background: repeating-linear-gradient(
      to bottom, var(--binder) 0 10px, transparent 10px 24px
    );
    opacity:0.9;
  }
  .book::after{
    content:"";
    position:absolute;
    left: 0; top: 0; bottom: 0; width: 30px;
    background-image: radial-gradient(circle at 8px 0, transparent 5px, var(--paper) 5.5px);
    background-size: 100% 40px;
    background-repeat: repeat-y;
  }

  .tabs{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .tab{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:1px; text-transform:uppercase;
    background:none; border:1px solid var(--rule-strong);
    color: var(--ink-soft);
    padding:8px 14px; cursor:pointer; border-radius:3px 3px 0 0;
    border-bottom:none;
  }
  .tab.active{
    background: var(--paper);
    color: var(--stamp);
    font-weight:600;
    box-shadow: 0 -2px 0 var(--stamp) inset;
  }
  .panel{ display:none; }
  .panel.active{ display:block; }

  label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:1.5px;
    color: var(--ink-soft); margin-bottom:4px; margin-top:14px;
  }
  input, select{
    width:100%; font-family:'IBM Plex Mono', monospace; font-size:15px;
    background:transparent; border:none; border-bottom: 1.5px solid var(--rule-strong);
    padding:6px 2px; color:var(--ink); outline:none;
  }
  input:focus, select:focus{ border-bottom-color: var(--stamp); }
  .row2{ display:flex; gap:16px; }
  .row2 > div{ flex:1; }

  .stamp-btn{
    margin-top:22px; width:100%;
    font-family:'Special Elite', monospace;
    font-size:16px; letter-spacing:2px; text-transform:uppercase;
    background: transparent;
    border: 2.5px solid var(--stamp);
    color: var(--stamp);
    padding: 10px;
    border-radius: 6px;
    cursor:pointer;
    transform: rotate(-1deg);
    transition: transform .15s ease, background .15s ease, color .15s ease;
  }
  .stamp-btn:hover{ background: var(--stamp); color:#fff; transform: rotate(0deg); }
  .stamp-btn:active{ transform: scale(0.97) rotate(0deg); }

  .status-line{ font-size:12px; color:var(--ink-soft); margin-top:10px; min-height:16px; }
  .status-line.err{ color:var(--stamp); }
  .status-line.ok{ color: var(--rule-strong); }

  .field-note{
    font-size:11px; color:var(--ink-soft); margin-top:18px; line-height:1.5;
    border-top:1px dashed var(--rule); padding-top:10px;
  }
  .field-note code{ background:#00000010; padding:1px 5px; border-radius:3px; }

  .month-select{ margin-bottom: 12px; }
  .total-line{
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom: 3px double var(--rule-strong);
    padding-bottom: 10px; margin-bottom: 12px;
  }
  .total-line .label{ font-family:'Special Elite',monospace; font-size:15px; letter-spacing:1px;}
  .total-line .amount{ font-size:22px; font-weight:700; }

  .stat-block{ margin-bottom: 16px; }
  .stat-block .s-row{ display:flex; justify-content:space-between; font-size:13px; padding:2px 0; }
  .stat-block .s-amt{ font-weight:600; }
  .stat-block .s-amt.over{ color: var(--stamp); }
  .stat-block .s-amt.under{ color: var(--rule-strong); }
  .stat-block .s-bar-track{ height:8px; background:rgba(0,0,0,0.08); border-radius:2px; overflow:hidden; margin-top:6px; }
  .stat-block .s-bar-fill{ height:100%; border-radius:2px; }
  .stat-block .s-bar-fill.spend{ background: linear-gradient(90deg, var(--rule-strong), var(--stamp)); }
  .stat-block .s-bar-fill.progress{ background: var(--brass); }
  .stat-block .no-budget{ font-style:italic; color:var(--ink-soft); font-size:12px; }
  .stat-block a.set-link{ color: var(--stamp); cursor:pointer; text-decoration:underline; }
  .section-divider{ border-top:1px dashed var(--rule); margin: 16px 0; }

  .cat-row{ margin-bottom: 14px; }
  .cat-row .cat-head{
    display:flex; justify-content:space-between; font-size:13px;
    text-transform:uppercase; letter-spacing:1px; margin-bottom:4px;
  }
  .cat-row .cat-amt{ font-weight:600; }
  .cat-bar-track{ height:7px; background: rgba(0,0,0,0.08); border-radius: 2px; overflow:hidden;}
  .cat-bar-fill{ height:100%; background: linear-gradient(90deg, var(--rule-strong), var(--stamp)); border-radius:2px; }
  .cat-row .cat-budget-line{ font-size:11px; color:var(--ink-soft); margin-top:3px; }
  .cat-row .cat-budget-line.over{ color:var(--stamp); }

  .entries{ margin-top: 24px; }
  .entries h3{
    font-family:'Special Elite', monospace; font-size:13px; letter-spacing:1px;
    color: var(--ink-soft); text-transform:uppercase; margin-bottom:8px;
    border-bottom:1px dashed var(--rule); padding-bottom:6px;
  }
  .entry-row{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    font-size:13px; padding:5px 0;
    border-bottom: 1px dotted rgba(0,0,0,0.12);
  }
  .entry-row .e-date{ color: var(--ink-soft); width:82px; flex-shrink:0; font-size:12px; }
  .entry-row .e-mid{ flex:1; min-width:0; }
  .entry-row .e-item{ display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entry-row .e-cat{ display:block; font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); }
  .entry-row .e-amt{ font-weight:600; width:80px; text-align:right; flex-shrink:0; }

  .budget-cat-row{ display:flex; align-items:center; gap:12px; margin-top:12px; }
  .budget-cat-row label{ margin:0; flex:1; }
  .budget-cat-row input{ width:110px; flex-shrink:0; text-align:right; }

  .budget-list{ margin-top:24px; }
  .budget-month-group{ margin-bottom:16px; }
  .budget-month-group h4{
    font-family:'Special Elite', monospace; font-size:12px; letter-spacing:1px;
    color: var(--ink); margin: 0 0 4px; text-transform:uppercase;
  }
  .budget-row{
    display:flex; justify-content:space-between; font-size:13px; padding:3px 0;
    border-bottom: 1px dotted rgba(0,0,0,0.12);
  }

  .empty{ font-size:13px; color:var(--ink-soft); font-style:italic; padding:12px 0; }

  @media (max-width:480px){
    .masthead h1{ font-size:22px; }
    .book{ padding:22px 16px 20px 36px; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="masthead">
    <h1>Ledger</h1>
    <div class="sub">Personal Expenditure Book</div>
  </div>

  <div class="book">
    <div class="tabs">
      <button class="tab active" data-tab="entry">New Entry</button>
      <button class="tab" data-tab="report">Monthly Report</button>
      <button class="tab" data-tab="budget">Budget</button>
    </div>

    <!-- ENTRY PANEL -->
    <div class="panel active" id="panel-entry">
      <form id="entry-form">
        <label for="f-item">Item</label>
        <input type="text" id="f-item" placeholder="e.g. Lunch with team" required>

        <label for="f-category">Category</label>
        <select id="f-category">
          <option>Food</option>
          <option>Transport</option>
          <option>Groceries</option>
          <option>Entertainment</option>
          <option>Shopping</option>
          <option>Other</option>
          <option value="__custom">+ Custom category…</option>
        </select>
        <input type="text" id="f-category-custom" placeholder="Enter category" style="display:none; margin-top:8px;">

        <div class="row2">
          <div>
            <label for="f-amount">Amount</label>
            <input type="number" id="f-amount" step="0.01" min="0" placeholder="0.00" required>
          </div>
          <div>
            <label for="f-date">Date</label>
            <input type="date" id="f-date" required>
          </div>
        </div>

        <button type="submit" class="stamp-btn">Ring Up</button>
        <div class="status-line" id="status"></div>
      </form>

      <div class="entries">
        <h3>Recent Entries</h3>
        <div id="recent-list"><div class="empty">Loading…</div></div>
      </div>

      <div class="field-note" id="config-note"></div>
    </div>

    <!-- REPORT PANEL -->
    <div class="panel" id="panel-report">
      <select id="month-select" class="month-select"></select>

      <div class="total-line">
        <span class="label">Total Spent</span>
        <span class="amount" id="month-total">$0.00</span>
      </div>

      <div class="stat-block" id="month-progress-block"></div>
      <div class="stat-block" id="overall-budget-block"></div>

      <div class="section-divider"></div>
      <div id="category-breakdown"><div class="empty">Loading…</div></div>
    </div>

    <!-- BUDGET PANEL -->
    <div class="panel" id="panel-budget">
      <form id="budget-form">
        <label for="b-month">Month</label>
        <select id="b-month"></select>

        <div id="budget-cat-fields"></div>

        <button type="submit" class="stamp-btn">Save Budgets</button>
        <div class="status-line" id="budget-status"></div>
      </form>

      <div class="field-note">Budgets apply to the six built-in categories. A custom category you typed on the New Entry tab won't have a budget line unless its name matches one of these exactly.</div>

      <div class="budget-list">
        <h3 style="font-family:'Special Elite', monospace; font-size:13px; letter-spacing:1px; color:var(--ink-soft); text-transform:uppercase; margin-bottom:8px; border-bottom:1px dashed var(--rule); padding-bottom:6px;">Budgets Set</h3>
        <div id="budget-history"><div class="empty">Loading…</div></div>
      </div>
    </div>

  </div>
</div>

<script>
/* ------------------------------------------------------------------
 * CONFIGURE ME: paste your Google Apps Script Web App URL here.
 * See README.md for how to get this. Until you do, the app runs in
 * local demo mode (data is stored in your browser only).
 * ---------------------------------------------------------------- */
const API_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

const isDemoMode = !API_URL || API_URL.indexOf("PASTE_YOUR") !== -1;
const LOCAL_ENTRIES_KEY = "ledger_demo_entries";
const LOCAL_BUDGETS_KEY = "ledger_demo_budgets";

const CATEGORIES = ["Food", "Transport", "Groceries", "Entertainment", "Shopping", "Other"];

function todayISO(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

// Normalizes any date value (clean ISO string, timestamp string, or a
// full "Thu Aug 01 2026 00:00:00 GMT+0800 (...)"-style string) down to
// a plain "yyyy-MM-dd" with no time-of-day component.
function toISODate(raw){
  if(raw === null || raw === undefined || raw === "") return "";
  const s = String(raw).trim();
  const isoMatch = s.match(/^\d{4}-\d{2}-\d{2}/);
  if(isoMatch) return isoMatch[0];
  const d = new Date(s);
  if(isNaN(d.getTime())) return "";
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function monthKeyFromOffset(offset){
  const d = new Date();
  d.setDate(1); // avoid month-length rollover surprises
  d.setMonth(d.getMonth() + offset);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}

function monthLabel(key){
  const [y,m] = key.split("-");
  const d = new Date(Number(y), Number(m)-1, 1);
  return d.toLocaleString(undefined, { month: "long", year: "numeric" });
}

function daysInMonth(key){
  const [y,m] = key.split("-").map(Number);
  return new Date(y, m, 0).getDate();
}

// % of the given month that has elapsed so far (0-100).
// Past months = 100, future months = 0.
function monthProgressPct(key){
  const current = todayISO().slice(0,7);
  if(key < current) return 100;
  if(key > current) return 0;
  const today = new Date();
  return Math.min(100, (today.getDate() / daysInMonth(key)) * 100);
}

function loadLocalEntries(){
  try{ return JSON.parse(localStorage.getItem(LOCAL_ENTRIES_KEY) || "[]"); }catch(e){ return []; }
}
function saveLocalEntries(list){
  localStorage.setItem(LOCAL_ENTRIES_KEY, JSON.stringify(list));
}
function loadLocalBudgets(){
  try{ return JSON.parse(localStorage.getItem(LOCAL_BUDGETS_KEY) || "{}"); }catch(e){ return {}; }
}
function saveLocalBudgets(obj){
  localStorage.setItem(LOCAL_BUDGETS_KEY, JSON.stringify(obj));
}

// Returns { entries: [...], budgets: { "2026-08": {Food:300, ...}, ... } }
async function fetchAll(){
  if(isDemoMode){
    return { entries: loadLocalEntries(), budgets: loadLocalBudgets() };
  }
  const res = await fetch(API_URL, { method: "GET" });
  if(!res.ok) throw new Error("Failed to load data");
  const data = await res.json();
  return { entries: data.entries || [], budgets: data.budgets || {} };
}

async function addEntry(entry){
  if(isDemoMode){
    const list = loadLocalEntries();
    list.push(entry);
    saveLocalEntries(list);
    return { status: "ok" };
  }
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(entry)
  });
  return await res.json();
}

// catBudgets: { "Food": 300, "Transport": 100, ... }
async function saveBudgets(month, catBudgets){
  if(isDemoMode){
    const budgets = loadLocalBudgets();
    budgets[month] = { ...(budgets[month] || {}), ...catBudgets };
    saveLocalBudgets(budgets);
    return { status: "ok" };
  }
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ type: "budget", month, budgets: catBudgets })
  });
  return await res.json();
}

function money(n){
  return "$" + Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}
function pct(n){
  return Math.round(n) + "%";
}

/* ---------------- Tabs ---------------- */
document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=> activateTab(btn.dataset.tab));
});
function activateTab(tab){
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add("active");
  document.getElementById("panel-" + tab).classList.add("active");
  if(tab === "report") renderReport();
  if(tab === "budget") loadBudgetTab();
}

/* ---------------- Entry form ---------------- */
const dateInput = document.getElementById("f-date");
dateInput.value = todayISO();

const catSelect = document.getElementById("f-category");
const catCustom = document.getElementById("f-category-custom");
catSelect.addEventListener("change", ()=>{
  catCustom.style.display = catSelect.value === "__custom" ? "block" : "none";
});

document.getElementById("entry-form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const statusEl = document.getElementById("status");
  const item = document.getElementById("f-item").value.trim();
  const amount = parseFloat(document.getElementById("f-amount").value);
  const category = catSelect.value === "__custom" ? (catCustom.value.trim() || "Other") : catSelect.value;
  const date = dateInput.value || todayISO();

  if(!item){
    statusEl.textContent = "Enter what the item was.";
    statusEl.classList.add("err");
    return;
  }
  if(!amount || amount <= 0){
    statusEl.textContent = "Enter an amount greater than zero.";
    statusEl.classList.add("err");
    return;
  }

  statusEl.classList.remove("err");
  statusEl.textContent = "Posting to ledger…";

  try{
    const result = await addEntry({ date, amount, category, item });
    if(result.status !== "ok") throw new Error(result.message || "Unknown error");
    statusEl.classList.remove("err");
    statusEl.textContent = "Entered " + money(amount) + " for " + item + ".";
    document.getElementById("f-item").value = "";
    document.getElementById("f-amount").value = "";
    await renderRecent();
  }catch(err){
    statusEl.textContent = "Could not save: " + err.message;
    statusEl.classList.add("err");
  }
});

/* ---------------- Recent entries ---------------- */
async function renderRecent(){
  const listEl = document.getElementById("recent-list");
  try{
    const { entries } = await fetchAll();
    if(entries.length === 0){
      listEl.innerHTML = '<div class="empty">No entries yet. Ring up your first one above.</div>';
      return;
    }
    const sorted = [...entries]
      .map(en => ({ ...en, _iso: toISODate(en.date) }))
      .sort((a,b)=> b._iso.localeCompare(a._iso))
      .slice(0,8);
    listEl.innerHTML = sorted.map(en => `
      <div class="entry-row">
        <span class="e-date">${en._iso}</span>
        <span class="e-mid">
          <span class="e-item">${en.item || "(no item)"}</span>
          <span class="e-cat">${en.category}</span>
        </span>
        <span class="e-amt">${money(en.amount)}</span>
      </div>
    `).join("");
  }catch(err){
    listEl.innerHTML = '<div class="empty">Could not load entries: ' + err.message + '</div>';
  }
}

/* ---------------- Monthly report ---------------- */
async function renderReport(){
  const monthSelect = document.getElementById("month-select");
  const totalEl = document.getElementById("month-total");
  const breakdownEl = document.getElementById("category-breakdown");
  const overallBudgetEl = document.getElementById("overall-budget-block");
  const progressEl = document.getElementById("month-progress-block");

  let entries, budgets;
  try{
    ({ entries, budgets } = await fetchAll());
  }catch(err){
    breakdownEl.innerHTML = '<div class="empty">Could not load entries: ' + err.message + '</div>';
    overallBudgetEl.innerHTML = "";
    progressEl.innerHTML = "";
    return;
  }

  if(entries.length === 0){
    monthSelect.innerHTML = "";
    totalEl.textContent = money(0);
    breakdownEl.innerHTML = '<div class="empty">No entries yet.</div>';
    overallBudgetEl.innerHTML = "";
    progressEl.innerHTML = "";
    return;
  }

  const previousSelection = monthSelect.value;
  const months = [...new Set(entries.map(e => toISODate(e.date).slice(0,7)).filter(Boolean))].sort().reverse();
  const currentMonth = todayISO().slice(0,7);
  const selected = previousSelection && months.includes(previousSelection) ? previousSelection
                   : (months.includes(currentMonth) ? currentMonth : months[0]);

  monthSelect.innerHTML = months.map(m => `<option value="${m}" ${m===selected?"selected":""}>${monthLabel(m)}</option>`).join("");
  monthSelect.onchange = renderReport;

  const inMonth = entries.filter(e => toISODate(e.date).slice(0,7) === selected);
  const total = inMonth.reduce((s,e)=> s + Number(e.amount), 0);
  totalEl.textContent = money(total);

  // --- % of month elapsed ---
  const progress = monthProgressPct(selected);
  progressEl.innerHTML = `
    <div class="s-row"><span>Month Elapsed</span><span class="s-amt">${pct(progress)}</span></div>
    <div class="s-bar-track"><div class="s-bar-fill progress" style="width:${progress.toFixed(1)}%"></div></div>
  `;

  // --- overall budget vs spend ---
  const monthBudgets = (budgets && budgets[selected]) || {};
  const overallBudget = Object.values(monthBudgets).reduce((s,v)=> s + (Number(v)||0), 0);

  if(overallBudget > 0){
    const spentPct = (total / overallBudget) * 100;
    const over = total > overallBudget;
    overallBudgetEl.innerHTML = `
      <div class="s-row"><span>Budget for ${monthLabel(selected)}</span><span class="s-amt">${money(overallBudget)}</span></div>
      <div class="s-row"><span>% of Budget Spent</span><span class="s-amt ${over ? "over" : "under"}">${pct(spentPct)}</span></div>
      <div class="s-bar-track"><div class="s-bar-fill spend" style="width:${Math.min(100,spentPct).toFixed(1)}%"></div></div>
    `;
  }else{
    overallBudgetEl.innerHTML = `<div class="no-budget">No budget set for ${monthLabel(selected)}. <a class="set-link" id="go-set-budget">Set one</a>.</div>`;
    const link = document.getElementById("go-set-budget");
    if(link) link.addEventListener("click", ()=>{
      activateTab("budget");
      setTimeout(()=>{
        const sel = document.getElementById("b-month");
        if(sel && [...sel.options].some(o=>o.value===selected)) sel.value = selected;
        prefillBudgetCategoryInputs();
      }, 0);
    });
  }

  // --- per-category breakdown ---
  const byCat = {};
  inMonth.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + Number(e.amount); });
  const catList = Object.entries(byCat).sort((a,b)=> b[1]-a[1]);
  const max = catList.length ? catList[0][1] : 1;

  breakdownEl.innerHTML = catList.map(([cat, amt]) => {
    const catBudget = monthBudgets[cat];
    let budgetLine = "";
    if(catBudget !== undefined && catBudget > 0){
      const catPct = (amt / catBudget) * 100;
      const over = amt > catBudget;
      budgetLine = `<div class="cat-budget-line ${over?'over':''}">${pct(catPct)} of ${money(catBudget)} budget${over ? " — over" : ""}</div>`;
    }
    return `
      <div class="cat-row">
        <div class="cat-head">
          <span>${cat}</span>
          <span class="cat-amt">${money(amt)} · ${total ? Math.round(amt/total*100) : 0}%</span>
        </div>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${(amt/max*100).toFixed(1)}%"></div></div>
        ${budgetLine}
      </div>
    `;
  }).join("");
}

/* ---------------- Budget tab ---------------- */
let cachedBudgets = {};
let cachedBudgetMonths = [];

// Build the category input fields once.
const budgetFieldsEl = document.getElementById("budget-cat-fields");
budgetFieldsEl.innerHTML = CATEGORIES.map(cat => `
  <div class="budget-cat-row">
    <label for="b-cat-${cat}">${cat}</label>
    <input type="number" step="0.01" min="0" id="b-cat-${cat}" class="b-cat-input" data-cat="${cat}" placeholder="0.00">
  </div>
`).join("");

function prefillBudgetCategoryInputs(){
  const month = document.getElementById("b-month").value;
  const monthBudgets = cachedBudgets[month] || {};
  CATEGORIES.forEach(cat => {
    const input = document.getElementById("b-cat-" + cat);
    input.value = monthBudgets[cat] !== undefined ? monthBudgets[cat] : "";
  });
}

document.getElementById("b-month").addEventListener("change", prefillBudgetCategoryInputs);

async function loadBudgetTab(){
  const monthSelect = document.getElementById("b-month");
  const previousSelection = monthSelect.value;

  let entries, budgets;
  try{
    ({ entries, budgets } = await fetchAll());
  }catch(err){
    document.getElementById("budget-history").innerHTML = '<div class="empty">Could not load budgets: ' + err.message + '</div>';
    return;
  }
  cachedBudgets = budgets || {};

  // Month options: a year back to a few months ahead, plus any month that
  // already has entries or budgets, so nothing is ever out of range.
  const generated = [];
  for(let i = -12; i <= 6; i++) generated.push(monthKeyFromOffset(i));
  const fromData = [
    ...Object.keys(cachedBudgets),
    ...entries.map(e => toISODate(e.date).slice(0,7)).filter(Boolean)
  ];
  cachedBudgetMonths = [...new Set([...generated, ...fromData])].sort().reverse();

  const currentMonth = todayISO().slice(0,7);
  const selected = previousSelection && cachedBudgetMonths.includes(previousSelection) ? previousSelection : currentMonth;
  monthSelect.innerHTML = cachedBudgetMonths.map(m => `<option value="${m}" ${m===selected?"selected":""}>${monthLabel(m)}</option>`).join("");

  prefillBudgetCategoryInputs();
  renderBudgetHistory();
}

document.getElementById("budget-form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const statusEl = document.getElementById("budget-status");
  const month = document.getElementById("b-month").value;

  if(!month){
    statusEl.textContent = "Choose a month.";
    statusEl.classList.add("err");
    return;
  }

  const catBudgets = {};
  let hasValue = false;
  CATEGORIES.forEach(cat => {
    const raw = document.getElementById("b-cat-" + cat).value;
    if(raw !== ""){
      const n = parseFloat(raw);
      if(!isNaN(n) && n >= 0){ catBudgets[cat] = n; hasValue = true; }
    }
  });

  if(!hasValue){
    statusEl.textContent = "Enter a budget for at least one category.";
    statusEl.classList.add("err");
    return;
  }

  statusEl.classList.remove("err");
  statusEl.textContent = "Saving…";

  try{
    const result = await saveBudgets(month, catBudgets);
    if(result.status !== "ok") throw new Error(result.message || "Unknown error");
    statusEl.classList.remove("err");
    statusEl.textContent = "Budgets saved for " + monthLabel(month) + ".";
    await loadBudgetTab();
  }catch(err){
    statusEl.textContent = "Could not save: " + err.message;
    statusEl.classList.add("err");
  }
});

function renderBudgetHistory(){
  const historyEl = document.getElementById("budget-history");
  const months = Object.keys(cachedBudgets).sort().reverse();
  if(months.length === 0){
    historyEl.innerHTML = '<div class="empty">No budgets set yet.</div>';
    return;
  }
  historyEl.innerHTML = months.map(m => {
    const cats = cachedBudgets[m];
    const rows = Object.entries(cats).map(([cat, amt]) => `
      <div class="budget-row"><span>${cat}</span><span>${money(amt)}</span></div>
    `).join("");
    const total = Object.values(cats).reduce((s,v)=> s + (Number(v)||0), 0);
    return `
      <div class="budget-month-group">
        <h4>${monthLabel(m)} · ${money(total)} total</h4>
        ${rows}
      </div>
    `;
  }).join("");
}

/* ---------------- Config note ---------------- */
document.getElementById("config-note").innerHTML = isDemoMode
  ? 'Running in <strong>local demo mode</strong> — entries are saved only in this browser (<code>localStorage</code>). Deploy the included <code>Code.gs</code> as a Google Apps Script Web App and paste the URL into <code>API_URL</code> at the top of the script in <code>index.html</code> to use a real Google Sheet as your database.'
  : 'Connected to your Google Sheet via Apps Script.';

renderRecent();
</script>
